<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow: Know what's on your shelves</title>
    <meta
      name="description"
      content="StockFlow is multi-tenant inventory control: track products and quantities, set low-stock thresholds, and see what needs attention before it runs out."
    />
    <!-- Deep Forest, so mobile browser chrome matches the brand -->
    <meta name="theme-color" content="#173F35" />
    <!-- Apply the saved (or OS) theme before first paint so reloads never flash the wrong theme.
         Keep the storage key in sync with src/lib/theme.tsx. -->
    <script>
      try {
        var t = localStorage.getItem('stockflow-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StockFlow" />
    <meta property="og:title" content="StockFlow: Know what's on your shelves" />
    <meta
      property="og:description"
      content="Inventory control for teams that count things. Track stock, set thresholds, act before it runs out."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
